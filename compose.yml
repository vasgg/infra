services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASS}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    shm_size: 256m
    mem_limit: 2G
    cpus: 2
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "autovacuum_max_workers=3"
      - "-c"
      - "autovacuum_naptime=30s"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - infra
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --hz 10
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    mem_limit: 768M
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - infra

  db-backup:
    image: tiredofit/db-backup
    restart: unless-stopped
    volumes:
      - ./backups:/backup
      - ./scripts/send-to-telegram.sh:/assets/scripts/post/send-to-telegram.sh:ro
      - ./scripts/notify-error.sh:/assets/scripts/notify-error.sh:ro
      - /home/vasg/projects/new_praxis_bot:/mnt/sqlite/new_praxis_bot:ro
      - /home/vasg/projects/logbook_robot/data:/mnt/sqlite/logbook_robot:ro
    environment:
      TIMEZONE: Asia/Tbilisi
      DEFAULT_COMPRESSION: ZSTD
      DEFAULT_COMPRESSION_LEVEL: 3
      DEFAULT_CHECKSUM: MD5
      DEFAULT_LOG_LEVEL: notice
      CONTAINER_ENABLE_MONITORING: "FALSE"

      # --- Telegram (отправка файлов бэкапов) ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      # --- Уведомления об ошибках бэкапа ---
      ENABLE_NOTIFICATIONS: "TRUE"
      NOTIFICATION_TYPE: CUSTOM
      NOTIFICATION_CUSTOM_SCRIPT: /assets/scripts/notify-error.sh

      # --- Postgres 1 ---
      DB01_TYPE: pgsql
      DB01_HOST: postgres
      DB01_PORT: 5432
      DB01_USER: ${PG_DB01_USER}
      DB01_PASS: ${PG_DB01_PASS}
      DB01_NAME: ${PG_DB01_NAME}
      DB01_BACKUP_BEGIN: "0400"
      DB01_BACKUP_INTERVAL: 1440
      DB01_CLEANUP_TIME: 20160       # 14 дней

      # --- Postgres 2 ---
      DB02_TYPE: pgsql
      DB02_HOST: postgres
      DB02_PORT: 5432
      DB02_USER: ${PG_DB02_USER}
      DB02_PASS: ${PG_DB02_PASS}
      DB02_NAME: ${PG_DB02_NAME}
      DB02_BACKUP_BEGIN: "0402"
      DB02_BACKUP_INTERVAL: 1440
      DB02_CLEANUP_TIME: 20160

      # --- Postgres 3 ---
      DB03_TYPE: pgsql
      DB03_HOST: postgres
      DB03_PORT: 5432
      DB03_USER: ${PG_DB03_USER}
      DB03_PASS: ${PG_DB03_PASS}
      DB03_NAME: ${PG_DB03_NAME}
      DB03_BACKUP_BEGIN: "0404"
      DB03_BACKUP_INTERVAL: 1440
      DB03_CLEANUP_TIME: 20160

      # --- Redis (db 0–3, общий пароль) ---
      DB04_TYPE: redis
      DB04_HOST: redis
      DB04_PORT: 6379
      DB04_PASS: ${REDIS_PASSWORD}
      DB04_NAME: ${REDIS_DB04_NUM:-0}
      DB04_BACKUP_BEGIN: "0410"
      DB04_BACKUP_INTERVAL: 1440
      DB04_CLEANUP_TIME: 20160

      DB05_TYPE: redis
      DB05_HOST: redis
      DB05_PORT: 6379
      DB05_PASS: ${REDIS_PASSWORD}
      DB05_NAME: ${REDIS_DB05_NUM:-1}
      DB05_BACKUP_BEGIN: "0412"
      DB05_BACKUP_INTERVAL: 1440
      DB05_CLEANUP_TIME: 20160

      DB06_TYPE: redis
      DB06_HOST: redis
      DB06_PORT: 6379
      DB06_PASS: ${REDIS_PASSWORD}
      DB06_NAME: ${REDIS_DB06_NUM:-2}
      DB06_BACKUP_BEGIN: "0414"
      DB06_BACKUP_INTERVAL: 1440
      DB06_CLEANUP_TIME: 20160

      DB07_TYPE: redis
      DB07_HOST: redis
      DB07_PORT: 6379
      DB07_PASS: ${REDIS_PASSWORD}
      DB07_NAME: ${REDIS_DB07_NUM:-3}
      DB07_BACKUP_BEGIN: "0416"
      DB07_BACKUP_INTERVAL: 1440
      DB07_CLEANUP_TIME: 20160

      # --- SQLite: new_praxis_bot ---
      DB08_TYPE: sqlite3
      DB08_NAME: /mnt/sqlite/new_praxis_bot/prod_new_praxis_bot.db
      DB08_BACKUP_BEGIN: "0420"
      DB08_BACKUP_INTERVAL: 1440
      DB08_CLEANUP_TIME: 20160

      # --- SQLite: logbook_robot ---
      DB09_TYPE: sqlite3
      DB09_NAME: /mnt/sqlite/logbook_robot/logbook.db
      DB09_BACKUP_BEGIN: "0422"
      DB09_BACKUP_INTERVAL: 1440
      DB09_CLEANUP_TIME: 20160
    mem_limit: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infra

networks:
  infra:
    name: infra
    driver: bridge

volumes:
  pg_data:
    name: infra_pg_data
  redis_data:
    name: infra_redis_data